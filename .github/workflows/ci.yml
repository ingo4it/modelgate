name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test --coverage

  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      # offline: FixtureEmbedder + MemoryVectorStore + recorded model fixtures.
      # A regression below any target in evals/run.ts fails the build (ADR-0002).
      - run: pnpm eval --provider fixture --gate
        env:
          ANTHROPIC_API_KEY: dummy
          VOYAGE_API_KEY: dummy
          DATABASE_URL: postgres://x:x@localhost:5432/x
          REDIS_URL: redis://localhost:6379
      - uses: actions/upload-artifact@v4
        with: { name: eval-results, path: evals/results/latest.json }

  docker:
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: modelgate:ci
